name: Deploy Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web platform files
        run: flutter create --org com.mathjump --project-name math_jump --platforms web .

      - run: flutter pub get

      - name: Build
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/play/"

      - name: Assemble site
        run: |
          mkdir -p _site/play
          cp -r docs/. _site/
          cp -r build/web/. _site/play/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}play/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
