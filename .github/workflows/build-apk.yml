name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Sinh các file Android còn thiếu (không ghi đè file đã có trong repo).
      - name: Create Android platform files
        run: flutter create --org com.mathjump --project-name math_jump --platforms android .

      # Firebase Auth cần minSdk 23.
      - name: Set minSdk 23
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          else
            sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      # Bật Firebase khi đã có android/app/google-services.json trong repo.
      - name: Enable Google Services plugin
        if: hashFiles('android/app/google-services.json') != ''
        run: |
          sed -i -E 's/^(\s*)id\("com\.android\.application"\) version/\1id("com.google.gms.google-services") version "4.4.2" apply false\n\1id("com.android.application") version/' android/settings.gradle.kts
          sed -i -E 's/^(\s*)id\("com\.android\.application"\)\s*$/\1id("com.android.application")\n\1id("com.google.gms.google-services")/' android/app/build.gradle.kts
          grep -q 'google-services' android/settings.gradle.kts
          grep -q 'google-services' android/app/build.gradle.kts
          echo "Google Services plugin enabled"

      # Ký app bằng khóa cố định (secret KEYSTORE_BASE64) để key hash Facebook
      # không đổi và bản mới cài đè được lên bản cũ.
      - name: Use fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          KS="$RUNNER_TEMP/mathjump.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          KS="$KS" python3 - <<'EOF'
          import os, re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          block = (
              '    signingConfigs {\n'
              '        create("fixed") {\n'
              '            storeFile = file("%s")\n'
              '            storePassword = "android"\n'
              '            keyAlias = "androiddebugkey"\n'
              '            keyPassword = "android"\n'
              '        }\n'
              '    }\n\n' % os.environ['KS'])
          s, n1 = re.subn(r'\n(\s*)buildTypes\s*\{', '\n' + block + r'\1buildTypes {', s, count=1)
          s, n2 = re.subn(r'signingConfigs\.getByName\("debug"\)', 'signingConfigs.getByName("fixed")', s)
          assert n1 == 1 and n2 >= 1, 'Could not patch signing config'
          open(p, 'w').write(s)
          print('Signing config patched')
          EOF

      - run: flutter pub get

      - name: Build
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MathJump-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # In chữ ký thật của APK và key hash Facebook tương ứng.
      - name: Show APK signature
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          SHA1=$($APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA-1' | awk '{print $NF}')
          echo "APK SHA-1: $SHA1"
          echo "Facebook key hash: $(echo $SHA1 | xxd -r -p | base64)"
          if [ "$SHA1" != "8a0964c9ebb1df022d0df8880b9e831743a60726" ]; then
            echo "::error::APK is not signed with the fixed Math Jump key"
            exit 1
          fi

      - name: Test
        run: flutter test
