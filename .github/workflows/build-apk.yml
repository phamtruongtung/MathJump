name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --org com.mathjump --project-name math_jump --platforms android .

      - name: Set minSdk 23
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts
          else
            sed -i -E 's/minSdkVersion +flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          fi

      - run: flutter pub get

      - name: Build
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: MathJump-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Test
        run: flutter test
