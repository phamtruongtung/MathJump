name: math_jump
description: "Math Jump - game luyện cộng trừ nhân chia cho trẻ em."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  # 0.3.x đi cùng firebase_core 3.x (0.4.x đòi firebase_core 4.x).
  firebase_app_check: ^0.3.2
  google_sign_in: ^7.2.0
  connectivity_plus: ^6.0.5
  share_plus: ^10.1.0
  confetti: ^0.8.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
