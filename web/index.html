<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Math Jump – game luyện cộng, trừ, nhân, chia cho mọi lứa tuổi.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iPhone: "Thêm vào Màn hình chính" mở như một app riêng -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Math Jump">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <meta name="theme-color" content="#8FD3FF">
  <title>Math Jump</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: linear-gradient(#8FD3FF, #D9F2FF 60%, #FFF6E0); min-height: 100vh;
      font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: #3B3355; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 24px; gap: 12px; }
    #loader img { width: 112px; height: 112px; border-radius: 26px; animation: jump .7s ease-in-out infinite alternate; }
    #loader h1 { margin: 0; color: #9775FA; font-size: 34px; font-weight: 900; }
    #loader p { margin: 0; font-size: 17px; font-weight: 600; }
    #help { display: none; max-width: 340px; background: #fff; border-radius: 18px; padding: 14px 16px;
      font-size: 15px; line-height: 1.5; text-align: left; }
    @keyframes jump { to { transform: translateY(-16px); } }
  </style>
</head>
<body>
  <div id="loader">
    <img src="icons/Icon-192.png" alt="">
    <h1>Math Jump</h1>
    <p id="status">Đang tải… / Loading…</p>
    <div id="help">
      <b>Tải lâu quá?</b><br>
      • Nếu bạn mở link từ Zalo, Messenger hay Facebook: bấm <b>•••</b> → <b>Mở bằng Safari</b>
        (hoặc copy link dán vào Safari).<br>
      • Kiểm tra kết nối mạng rồi tải lại trang.<br>
      • Cần iOS 15 trở lên (Cài đặt → Cài đặt chung → Giới thiệu).
    </div>
  </div>
  <script>
    function hideLoader() {
      var l = document.getElementById('loader');
      if (l) l.remove();
    }
    // Chỉ ẩn màn hình chờ khi game đã vẽ xong khung hình đầu tiên. (Khung vẽ
    // của Flutter có thể xuất hiện trước khi game khởi động xong — ẩn sớm sẽ
    // để lại màn hình trắng nếu khởi động bị treo.)
    window.addEventListener('flutter-first-frame', hideLoader);
    setTimeout(function () {
      var h = document.getElementById('help');
      if (h && document.getElementById('loader')) h.style.display = 'block';
    }, 25000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
